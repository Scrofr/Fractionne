<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fractionné</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fractionné">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
  /* ---------- Tokens ---------- */
  :root{
    --paper:#FFFFFF; --ink:#000000;
    --bg:var(--paper); --fg:var(--ink);
    --mut:#767676; --line:#D4D4D4;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--bg); color:var(--fg);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#000000; --ink:#F5F5F5; }
  }
  :root[data-theme="dark"]{ --paper:#000000; --ink:#F5F5F5; }
  :root[data-theme="light"]{ --paper:#FFFFFF; --ink:#000000; }
  /* Étape « Effort » : on inverse tout l'écran */
  :root.effort{ --bg:var(--ink); --fg:var(--paper); }
  @supports (color: color-mix(in srgb, red, blue)){
    :root{
      --mut:color-mix(in srgb, var(--fg) 55%, var(--bg));
      --line:color-mix(in srgb, var(--fg) 20%, var(--bg));
    }
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
  body{
    height:100%; margin:0; overflow:hidden;
    background:var(--bg); color:var(--fg);
    font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  button,input,select{ font-family:inherit; color:inherit; touch-action:manipulation; }
  button{ cursor:pointer; -webkit-user-select:none; user-select:none; }
  :focus-visible{ outline:3px solid var(--fg); outline-offset:3px; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  #app{ height:100%; position:relative; }
  .view{ position:absolute; inset:0; display:flex; flex-direction:column; }
  .view[hidden]{ display:none; }
  .wrap{ width:100%; max-width:560px; margin:0 auto; }

  /* ---------- Boutons ---------- */
  .btn{
    display:block; width:100%; min-height:72px; padding:0 20px;
    border:2px solid var(--fg); border-radius:16px;
    background:var(--fg); color:var(--bg);
    font-size:22px; font-weight:800; letter-spacing:.02em; text-transform:uppercase;
  }
  .btn.ghost{ background:transparent; color:var(--fg); }
  .btn:active{ opacity:.7; }
  .ghost-s{
    min-height:48px; padding:0 18px; border:2px solid var(--fg); border-radius:12px;
    background:transparent; font-size:16px; font-weight:700;
  }
  .ghost-s:active{ opacity:.6; }

  /* ---------- Configuration ---------- */
  .scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:28px 20px 28px; }
  .foot{ padding:14px 20px 14px; background:var(--bg); border-top:2px solid var(--fg); }

  h1{
    margin:0 0 14px; font-size:min(15vw,96px); font-weight:900; font-stretch:75%;
    letter-spacing:-.04em; line-height:.86;
  }
  .lead{ margin:0 0 28px; font-size:18px; font-weight:600; color:var(--mut); font-variant-numeric:tabular-nums; }
  h2{ margin:0 0 6px; font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .sec{ border-top:2px solid var(--fg); padding:18px 0 26px; }
  .hint{ margin:0 0 8px; font-size:15px; line-height:1.4; color:var(--mut); max-width:46ch; }

  .line{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    min-height:68px; border-bottom:1px solid var(--line);
  }
  .line:last-child{ border-bottom:0; }
  .lab{ font-size:19px; font-weight:700; }
  .lab small{ display:block; font-size:14px; font-weight:500; color:var(--mut); }

  .stepper{ display:flex; align-items:center; gap:4px; }
  .stepper button{
    width:52px; height:52px; border:2px solid var(--fg); border-radius:14px; background:none;
    font-size:28px; font-weight:700; line-height:1;
  }
  .stepper button:active{ background:var(--fg); color:var(--bg); }
  .stepper .val{
    min-width:76px; text-align:center; font-size:36px; font-weight:900; font-stretch:80%;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  }

  .seg{ display:flex; border:2px solid var(--fg); border-radius:14px; overflow:hidden; }
  .seg button{
    flex:1; min-height:46px; padding:0 14px; border:0; background:transparent;
    font-size:16px; font-weight:700; white-space:nowrap;
  }
  .seg button + button{ border-left:2px solid var(--fg); }
  .seg button[aria-pressed="true"]{ background:var(--fg); color:var(--bg); }

  /* étapes */
  .step{ display:grid; gap:12px; padding:18px 0; border-bottom:1px solid var(--line); }
  .row{ display:flex; align-items:center; gap:10px; }
  .row > .seg{ margin-left:auto; }
  input[type=text], input[type=number], select{
    font-size:20px; font-weight:700; background:transparent; color:var(--fg);
    border:0; border-bottom:2px solid var(--fg); border-radius:0; padding:10px 0;
    -webkit-appearance:none; appearance:none; min-width:0;
  }
  input[type=number]{ -moz-appearance:textfield; width:58px; text-align:center; font-variant-numeric:tabular-nums; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .f-name{ flex:1; }
  .dur{ display:flex; align-items:baseline; gap:6px; }
  .dur span{ font-size:16px; font-weight:600; color:var(--mut); margin-right:8px; }
  .ico{
    width:44px; height:44px; flex:none; border:2px solid var(--fg); border-radius:12px; background:none;
    font-size:20px; font-weight:700; line-height:1;
  }
  .ico:disabled{ opacity:.25; cursor:default; }
  .sel{ position:relative; flex:1; display:flex; align-items:center; gap:10px; min-width:0; }
  .sel .t{ font-size:15px; font-weight:600; color:var(--mut); white-space:nowrap; }
  .sel select{ flex:1; padding-right:24px; }
  .sel::after{ content:"▾"; position:absolute; right:2px; bottom:12px; pointer-events:none; font-size:16px; }
  #add{ margin-top:18px; min-height:60px; font-size:18px; }

  input[type=range]{ flex:1; max-width:240px; accent-color:var(--fg); height:32px; }
  #audio-help{ margin:10px 0 0; min-height:2.8em; }
  .col{ padding:12px 0 6px; }
  .col .lab{ display:block; margin-bottom:10px; }

  /* ---------- Exécution ---------- */
  #v-run{ padding:16px 20px 16px; overscroll-behavior:none; }
  #v-run .wrap{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; }
  .top span:last-child{ color:var(--mut); font-weight:700; }
  .bar{ height:8px; margin-top:14px; background:var(--line); }
  .bar i{ display:block; height:100%; width:0; background:var(--fg); }
  .mid{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; }
  .r-name{
    font-size:min(13vw,7vh,84px); font-weight:900; font-stretch:75%; letter-spacing:-.03em; line-height:1;
    margin:0 0 4px; overflow-wrap:anywhere;
  }
  .time{
    font-size:min(54vw,36vh,320px); font-weight:900; font-stretch:75%; letter-spacing:-.05em; line-height:.88;
    font-variant-numeric:tabular-nums; white-space:nowrap; margin-left:-.03em;
  }
  .time.long{ font-size:min(34vw,26vh,220px); }
  .time.paused{ opacity:.35; }
  .next{ margin:0 0 18px; }
  .next small{ display:block; font-size:18px; font-weight:600; color:var(--mut); }
  .next b{ display:block; font-size:min(9vw,4.6vh,44px); font-weight:800; letter-spacing:-.02em; line-height:1.15; }
  .btns{ display:grid; gap:10px; }
  #b-sec{ min-height:60px; font-size:17px; }
</style>
</head>
<body>
<main id="app">

  <!-- ======= CONFIGURATION ======= -->
  <section id="v-config" class="view">
    <div class="scroll">
      <div class="wrap">
        <h1>Fractionné</h1>
        <p id="summary" class="lead"></p>

        <div class="sec">
          <div class="line">
            <span class="lab">Séries</span>
            <div class="stepper" data-k="reps">
              <button data-d="-1" aria-label="Moins de séries">−</button>
              <output class="val" aria-live="polite"></output>
              <button data-d="1" aria-label="Plus de séries">+</button>
            </div>
          </div>
          <div class="line">
            <span class="lab">Préparation<small>avant la première étape</small></span>
            <div class="stepper" data-k="prep">
              <button data-d="-1" aria-label="Moins de préparation">−</button>
              <output class="val" aria-live="polite"></output>
              <button data-d="1" aria-label="Plus de préparation">+</button>
            </div>
          </div>
        </div>

        <div class="sec">
          <h2>Étapes</h2>
          <p class="hint">Les étapes « Effort » inversent les couleurs de l'écran, pour te repérer d'un coup d'œil en courant.</p>
          <div id="steps"></div>
          <button id="add" class="btn ghost">Ajouter une étape</button>
        </div>

        <div class="sec">
          <h2>Son</h2>
          <div class="line">
            <label class="lab" for="vol">Volume</label>
            <input id="vol" type="range" min="0.2" max="1" step="0.05">
          </div>
          <div class="line">
            <span class="lab">Décompte<small>3 bips avant la fin</small></span>
            <div class="seg" data-opt="ticks" role="group" aria-label="Décompte">
              <button data-v="true">Oui</button><button data-v="false">Non</button>
            </div>
          </div>
          <div class="col">
            <span class="lab">Musique en arrière-plan</span>
            <div class="seg" data-opt="audio" role="group" aria-label="Mode audio">
              <button data-v="ambient">Mixer</button><button data-v="transient">Atténuer</button><button data-v="playback">Priorité</button>
            </div>
            <p id="audio-help" class="hint"></p>
          </div>
        </div>

        <div class="sec">
          <h2>Apparence</h2>
          <div class="seg" data-opt="theme" role="group" aria-label="Apparence">
            <button data-v="auto">Auto</button><button data-v="dark">Sombre</button><button data-v="light">Clair</button>
          </div>
        </div>
      </div>
    </div>
    <div class="foot"><div class="wrap"><button id="start" class="btn">Démarrer</button></div></div>
  </section>

  <!-- ======= EXÉCUTION ======= -->
  <section id="v-run" class="view" hidden>
    <div class="wrap">
      <div class="top"><span id="r-cycle"></span><span id="r-left"></span></div>
      <div class="bar" aria-hidden="true"><i id="r-bar"></i></div>
      <div class="mid">
        <p id="r-name" class="r-name" aria-live="polite"></p>
        <div id="r-time" class="time"></div>
      </div>
      <div class="next"><small id="r-nextlab">Ensuite</small><b id="r-next"></b></div>
      <div class="btns">
        <button id="b-main" class="btn"></button>
        <button id="b-sec" class="btn ghost"></button>
      </div>
    </div>
  </section>
</main>

<!-- Piste silencieuse en boucle : garde la session audio iOS active écran verrouillé -->
<audio id="keep" loop playsinline preload="auto"></audio>

<noscript>Cette application nécessite JavaScript.</noscript>

<script>
(() => {
'use strict';

/* ================= Utilitaires ================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtLong = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}` : `${m}:${String(r).padStart(2,'0')}`;
};

/* ================= Données ================= */
const KEY = 'fractionne:v1';
const SOUND_NAMES = {
  bip:'Bip', double:'Double bip', triple:'Triple bip', depart:'Départ',
  cloche:'Cloche', sirene:'Sirène', klaxon:'Klaxon', gong:'Gong'
};
const AUDIO_HELP = {
  ambient:'La musique continue, les bips passent par-dessus. iOS peut couper le son quand l\'écran se verrouille : à tester.',
  transient:'La musique baisse le temps d\'un bip, si iOS l\'autorise. À tester aussi écran verrouillé.',
  playback:'Le plus fiable écran verrouillé, mais iOS met ta musique en pause pendant la séance.'
};
const defaults = () => ({
  reps: 8, prep: 10, ticks: true, vol: 0.9, audio: 'ambient', theme: 'auto',
  steps: [
    { id: 1, name: 'Sprint', dur: 30, sound: 'double', effort: true },
    { id: 2, name: 'Repos',  dur: 40, sound: 'triple', effort: false }
  ]
});
function load(){
  const d = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return d;
    const c = { ...d, ...JSON.parse(raw) };
    if (!Array.isArray(c.steps) || !c.steps.length) c.steps = d.steps;
    c.steps = c.steps.map((s, i) => ({
      id: s.id || i + 1,
      name: String(s.name || '').slice(0, 24),
      dur: clamp(parseInt(s.dur) || 30, 1, 5999),
      sound: SOUND_NAMES[s.sound] ? s.sound : 'bip',
      effort: !!s.effort
    }));
    c.reps = clamp(parseInt(c.reps) || 8, 1, 99);
    c.prep = clamp(parseInt(c.prep) || 0, 0, 60);
    c.vol = clamp(parseFloat(c.vol) || 0.9, 0.2, 1);
    c.ticks = c.ticks !== false;
    if (!['ambient','transient','playback'].includes(c.audio)) c.audio = 'ambient';
    if (!['auto','light','dark'].includes(c.theme)) c.theme = 'auto';
    return c;
  } catch (e) { return d; }
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };
const cfg = load();

/* ================= Sons (Web Audio) ================= */
function osc(c, dest, o){
  const { f, t, d, type = 'sine', v = 0.5, to = null, decay = false, a = 0.006 } = o;
  const os = c.createOscillator(), g = c.createGain();
  os.type = type;
  os.frequency.setValueAtTime(f, t);
  if (to) os.frequency.linearRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + a);
  if (!decay) g.gain.setValueAtTime(v, t + Math.max(a, d - 0.05));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  os.connect(g); g.connect(dest);
  os.start(t); os.stop(t + d + 0.05);
}
const SND = {
  tick:   (c,d,t) => osc(c,d,{ f:880, t, d:.09, v:.45 }),
  bip:    (c,d,t) => osc(c,d,{ f:1000, t, d:.5, type:'square', v:.4 }),
  double: (c,d,t) => [0,.26].forEach(x => osc(c,d,{ f:1000, t:t+x, d:.17, type:'square', v:.4 })),
  triple: (c,d,t) => [0,.2,.4].forEach(x => osc(c,d,{ f:1300, t:t+x, d:.13, type:'square', v:.38 })),
  depart: (c,d,t) => [[600,0],[800,.16],[1200,.32]].forEach(([f,x],i) => osc(c,d,{ f, t:t+x, d:i===2?.6:.12, type:'triangle', v:.6 })),
  cloche: (c,d,t) => [[880,.5],[2429,.22],[4752,.1]].forEach(([f,v]) => osc(c,d,{ f, t, d:1.8, v, decay:true })),
  sirene: (c,d,t) => {
    osc(c,d,{ f:600,  to:1300, t,      d:.45, type:'sawtooth', v:.28 });
    osc(c,d,{ f:1300, to:600,  t:t+.45, d:.45, type:'sawtooth', v:.28 });
  },
  klaxon: (c,d,t) => {
    osc(c,d,{ f:440, t,      d:.3,  type:'sawtooth', v:.3 });
    osc(c,d,{ f:330, t:t+.34, d:.55, type:'sawtooth', v:.3 });
  },
  gong:   (c,d,t) => [[196,.55],[294,.3],[396,.22],[608,.12]].forEach(([f,v]) => osc(c,d,{ f, t, d:2.4, v, decay:true })),
  fin:    (c,d,t) => {
    [[784,0],[988,.18],[1175,.36]].forEach(([f,x]) => osc(c,d,{ f, t:t+x, d:.16, type:'triangle', v:.6 }));
    osc(c,d,{ f:1568, t:t+.6, d:1, type:'triangle', v:.6 });
  }
};

/* ================= Audio : contexte, session, piste silencieuse ================= */
const keep = $('#keep');
function silentWav(){
  const rate = 8000, n = 8000, buf = new Uint8Array(44 + n), v = new DataView(buf.buffer);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) buf[o + i] = s.charCodeAt(i); };
  w(0,'RIFF'); v.setUint32(4, 36 + n, true); w(8,'WAVEfmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,rate,true); v.setUint32(28,rate,true);
  v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
  for (let i = 0; i < n; i++) buf[44 + i] = i % 97 === 0 ? 129 : 128;
  let bin = ''; for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
  return 'data:audio/wav;base64,' + btoa(bin);
}
keep.src = silentWav();

const S = { status:'idle', ctx:null, master:null, t0:0, segs:[], total:0, i:0, lastI:-1, reps:0 };

function ensureCtx(){
  if (!S.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    S.ctx = new AC({ latencyHint: 'playback' });
    // Déverrouillage iOS : un buffer vide joué pendant le geste utilisateur
    try {
      const b = S.ctx.createBuffer(1, 1, 22050), src = S.ctx.createBufferSource();
      src.buffer = b; src.connect(S.ctx.destination); src.start(0);
    } catch (e) {}
  }
  return S.ctx;
}
function applySession(){
  try { if (navigator.audioSession) navigator.audioSession.type = cfg.audio; } catch (e) {}
}

let previewTimer = null;
async function preview(key){
  const c = ensureCtx();
  applySession();
  try { await c.resume(); } catch (e) {}
  const g = c.createGain(); g.gain.value = cfg.vol; g.connect(c.destination);
  SND[key](c, g, c.currentTime + 0.05);
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => { if (S.status === 'idle') c.suspend().catch(() => {}); }, 3200);
}

/* ================= Wake Lock ================= */
let wl = null;
async function lockScreen(){
  try {
    if ('wakeLock' in navigator && !wl && document.visibilityState === 'visible') {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  } catch (e) { wl = null; }
}
function unlockScreen(){ try { wl && wl.release(); } catch (e) {} wl = null; }
document.addEventListener('pointerdown', lockScreen, { passive: true });

/* ================= Media Session (écran verrouillé) ================= */
function setMedia(seg){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: seg ? seg.name : 'Terminé',
      artist: seg ? (seg.kind === 'prep' ? 'Préparation' : `Série ${seg.cycle} / ${S.reps}`) : 'Fractionné',
      album: 'Fractionné'
    });
  } catch (e) {}
}
function mediaState(s){ try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = s; } catch (e) {} }
try {
  const ms = navigator.mediaSession;
  ms.setActionHandler('play',  () => { if (S.status === 'paused')  resume(); });
  ms.setActionHandler('pause', () => { if (S.status === 'running') pause(); });
} catch (e) {}
// Si iOS met la piste en pause (verrouillage, appel, bouton écran de verrouillage)
keep.addEventListener('pause', () => { if (S.status === 'running') pause(); });
keep.addEventListener('play',  () => { if (S.status === 'paused')  resume(); });

/* ================= Programme ================= */
function buildSegs(){
  const segs = [];
  if (cfg.prep > 0) segs.push({ kind:'prep', name:'Préparation', dur:cfg.prep, sound:'depart', effort:false, cycle:0 });
  for (let r = 1; r <= cfg.reps; r++)
    cfg.steps.forEach(s => segs.push({ kind:'step', name:s.name || 'Étape', dur:s.dur, sound:s.sound, effort:s.effort, cycle:r }));
  let acc = 0;
  segs.forEach(s => { s.start = acc; acc += s.dur; s.end = acc; });
  return { segs, total: acc };
}
function scheduleAll(){
  const c = S.ctx;
  const master = c.createGain(); master.gain.value = cfg.vol; master.connect(c.destination);
  S.master = master;
  S.t0 = c.currentTime + 0.25;
  if (!cfg.prep) SND.depart(c, master, S.t0);
  S.segs.forEach((s, i) => {
    const end = S.t0 + s.end;
    if (cfg.ticks && s.dur >= 4) for (let k = 1; k <= 3; k++) SND.tick(c, master, end - k);
    if (i === S.segs.length - 1) SND.fin(c, master, end);
    else SND[s.sound](c, master, end);
  });
}
// Horloge unique = horloge audio : aucune dérive possible entre l'affichage et les bips.
const elapsed = () => (S.ctx && S.status !== 'idle') ? Math.max(0, S.ctx.currentTime - S.t0) : 0;

/* ================= Affichage exécution ================= */
let confirming = false, confirmT = null;
function renderButtons(){
  if (S.status === 'done') { $('#b-main').textContent = 'Refaire'; $('#b-sec').textContent = 'Modifier'; return; }
  $('#b-main').textContent = S.status === 'paused' ? 'Reprendre' : 'Pause';
  $('#b-sec').textContent  = confirming ? 'Toucher pour confirmer' : 'Réinitialiser';
}
function renderRun(){
  const root = document.documentElement, timeEl = $('#r-time');
  if (S.status === 'done') {
    root.classList.remove('effort');
    $('#r-cycle').textContent = 'Terminé';
    $('#r-left').textContent = '';
    $('#r-name').textContent = 'Bien joué';
    timeEl.textContent = fmtLong(S.total);
    timeEl.className = 'time long';
    $('#r-nextlab').textContent = 'Séance';
    $('#r-next').textContent = `${S.reps} série${S.reps > 1 ? 's' : ''} terminée${S.reps > 1 ? 's' : ''}`;
    $('#r-bar').style.width = '100%';
    renderButtons();
    return;
  }
  const e = elapsed();
  while (S.i < S.segs.length - 1 && e >= S.segs[S.i].end) S.i++;
  const s = S.segs[S.i];
  const rem = Math.max(0, Math.ceil(s.end - e - 1e-6));
  const nx = S.segs[S.i + 1];

  root.classList.toggle('effort', !!s.effort);
  $('#r-cycle').textContent = s.kind === 'prep' ? 'Préparation' : `Série ${s.cycle} / ${S.reps}`;
  $('#r-left').textContent = 'Reste ' + fmt(S.total - e);
  $('#r-name').textContent = s.name;
  timeEl.textContent = rem >= 60 ? fmt(rem) : String(rem);
  timeEl.className = 'time' + (rem >= 60 ? ' long' : '') + (S.status === 'paused' ? ' paused' : '');
  $('#r-nextlab').textContent = S.status === 'paused' ? 'En pause · ensuite' : 'Ensuite';
  $('#r-next').textContent = nx ? `${nx.name} · ${fmt(nx.dur)}` : 'Fin de séance';
  $('#r-bar').style.width = clamp(((e - s.start) / s.dur) * 100, 0, 100) + '%';
  if (S.i !== S.lastI) { S.lastI = S.i; setMedia(s); }
  renderButtons();
}
function tick(){
  if (S.status !== 'running') return;
  if (elapsed() >= S.total) { finish(); return; }
  renderRun();
}
setInterval(tick, 100);

/* ================= Contrôles ================= */
function show(v){
  $('#v-config').hidden = v !== 'config';
  $('#v-run').hidden = v !== 'run';
  if (v === 'config') document.documentElement.classList.remove('effort');
}
async function start(){
  const { segs, total } = buildSegs();
  S.segs = segs; S.total = total; S.i = 0; S.lastI = -1; S.reps = cfg.reps;
  confirming = false;
  const c = ensureCtx();
  applySession();
  const rp = c.resume();                      // les deux dans le geste utilisateur (politique autoplay iOS)
  const pp = keep.play();
  try { await rp; } catch (e) {}
  if (pp && pp.catch) pp.catch(() => {});
  if (S.master) { try { S.master.disconnect(); } catch (e) {} }
  scheduleAll();
  S.status = 'running';
  lockScreen();
  mediaState('playing');
  show('run');
  renderRun();
}
async function pause(){
  if (S.status !== 'running') return;
  S.status = 'paused';
  try { await S.ctx.suspend(); } catch (e) {}   // fige l'horloge audio : bips et affichage restent alignés
  keep.pause();
  mediaState('paused');
  renderRun();
}
async function resume(){
  if (S.status !== 'paused') return;
  S.status = 'running';
  applySession();
  keep.play().catch(() => {});
  try { await S.ctx.resume(); } catch (e) {}
  mediaState('playing');
  renderRun();
}
async function reset(){
  clearTimeout(confirmT); confirming = false;
  if (S.master) { try { S.master.disconnect(); } catch (e) {} S.master = null; }
  S.status = 'idle';
  keep.pause();
  mediaState('none');
  try { await S.ctx.suspend(); } catch (e) {}
  show('config');
}
function finish(){
  if (S.status === 'done') return;
  S.status = 'done';
  unlockScreen();
  setMedia(null);
  renderRun();
  setTimeout(() => {
    if (S.status === 'done') { keep.pause(); S.ctx && S.ctx.suspend().catch(() => {}); mediaState('none'); }
  }, 3800);
}
$('#start').addEventListener('click', start);
$('#b-main').addEventListener('click', () => {
  if (S.status === 'running') pause();
  else if (S.status === 'paused') resume();
  else if (S.status === 'done') start();
});
$('#b-sec').addEventListener('click', () => {
  if (S.status === 'done') { reset(); return; }
  if (!confirming) {
    confirming = true; renderButtons();
    confirmT = setTimeout(() => { confirming = false; renderButtons(); }, 3000);
    return;
  }
  reset();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  lockScreen();
  if (S.status === 'running') {
    if (S.ctx.state !== 'running') S.ctx.resume().catch(() => {});
    tick();
  }
});

/* ================= Configuration : rendu ================= */
const stepsEl = $('#steps');
const nextId = () => cfg.steps.reduce((m, s) => Math.max(m, s.id), 0) + 1;

function stepHTML(s, i, n){
  const m = Math.floor(s.dur / 60), sec = s.dur % 60;
  const opts = Object.entries(SOUND_NAMES)
    .map(([k, v]) => `<option value="${k}"${k === s.sound ? ' selected' : ''}>${v}</option>`).join('');
  return `<div class="step" data-id="${s.id}">
    <div class="row">
      <input class="f-name" type="text" value="${esc(s.name)}" maxlength="24" placeholder="Nom de l'étape" aria-label="Nom de l'étape" autocomplete="off" enterkeyhint="done">
      <button class="ico" data-a="up" aria-label="Monter l'étape"${i === 0 ? ' disabled' : ''}>↑</button>
      <button class="ico" data-a="down" aria-label="Descendre l'étape"${i === n - 1 ? ' disabled' : ''}>↓</button>
      <button class="ico" data-a="del" aria-label="Supprimer l'étape"${n === 1 ? ' disabled' : ''}>×</button>
    </div>
    <div class="row">
      <div class="dur">
        <input class="f-min" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="99" value="${m}" aria-label="Minutes"><span>min</span>
        <input class="f-sec" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="99" value="${sec}" aria-label="Secondes"><span>s</span>
      </div>
      <div class="seg" data-k="effort" role="group" aria-label="Intensité">
        <button data-v="1" aria-pressed="${s.effort}">Effort</button><button data-v="0" aria-pressed="${!s.effort}">Récup</button>
      </div>
    </div>
    <div class="row">
      <label class="sel"><span class="t">Sonnerie de fin</span><select class="f-snd">${opts}</select></label>
      <button class="ghost-s" data-a="prev">Écouter</button>
    </div>
  </div>`;
}
function renderSteps(){
  const n = cfg.steps.length;
  stepsEl.innerHTML = cfg.steps.map((s, i) => stepHTML(s, i, n)).join('');
  updateSummary();
}
function updateSummary(){
  const per = cfg.steps.reduce((a, s) => a + s.dur, 0);
  const total = cfg.prep + cfg.reps * per;
  const n = cfg.steps.length;
  $('#summary').textContent = `${cfg.reps} série${cfg.reps > 1 ? 's' : ''} · ${n} étape${n > 1 ? 's' : ''} · ${fmtLong(total)} au total`;
}
function syncConfig(){
  $('[data-k="reps"] .val').textContent = cfg.reps;
  $('[data-k="prep"] .val').textContent = cfg.prep + ' s';
  $('#vol').value = cfg.vol;
  $$('.seg[data-opt]').forEach(seg => {
    const cur = String(cfg[seg.dataset.opt]);
    $$('button', seg).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === cur)));
  });
  $('#audio-help').textContent = AUDIO_HELP[cfg.audio];
  const r = document.documentElement;
  if (cfg.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', cfg.theme);
  updateSummary();
}

/* ================= Configuration : événements ================= */
const stepOf = el => {
  const box = el.closest('.step');
  return box ? cfg.steps.find(s => s.id === +box.dataset.id) : null;
};
function readDur(box, st, normalize){
  const mi = $('.f-min', box), si = $('.f-sec', box);
  let total = clamp(parseInt(mi.value) || 0, 0, 99) * 60 + clamp(parseInt(si.value) || 0, 0, 99);
  total = clamp(total, 1, 5999);
  st.dur = total;
  if (normalize) { mi.value = Math.floor(total / 60); si.value = total % 60; }
}
stepsEl.addEventListener('input', e => {
  const st = stepOf(e.target); if (!st) return;
  if (e.target.classList.contains('f-name')) st.name = e.target.value;
  else if (e.target.matches('.f-min,.f-sec')) readDur(e.target.closest('.step'), st, false);
  save(); updateSummary();
});
stepsEl.addEventListener('change', e => {
  const st = stepOf(e.target); if (!st) return;
  if (e.target.matches('.f-min,.f-sec')) { readDur(e.target.closest('.step'), st, true); save(); updateSummary(); }
  if (e.target.classList.contains('f-snd')) { st.sound = e.target.value; save(); preview(st.sound); }
});
stepsEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const st = stepOf(b); if (!st) return;
  const idx = cfg.steps.indexOf(st);
  if (b.dataset.a === 'up' && idx > 0) { [cfg.steps[idx-1], cfg.steps[idx]] = [cfg.steps[idx], cfg.steps[idx-1]]; save(); renderSteps(); }
  else if (b.dataset.a === 'down' && idx < cfg.steps.length - 1) { [cfg.steps[idx+1], cfg.steps[idx]] = [cfg.steps[idx], cfg.steps[idx+1]]; save(); renderSteps(); }
  else if (b.dataset.a === 'del' && cfg.steps.length > 1) { cfg.steps.splice(idx, 1); save(); renderSteps(); }
  else if (b.dataset.a === 'prev') preview(st.sound);
  else if (b.closest('.seg[data-k="effort"]')) {
    st.effort = b.dataset.v === '1';
    $$('button', b.parentElement).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    save();
  }
});
$('#add').addEventListener('click', () => {
  cfg.steps.push({ id: nextId(), name: '', dur: 30, sound: 'bip', effort: false });
  save(); renderSteps();
  const last = $$('.f-name', stepsEl).pop(); last && last.focus();
});
$$('.stepper').forEach(st => st.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = +b.dataset.d;
  if (st.dataset.k === 'reps') cfg.reps = clamp(cfg.reps + d, 1, 99);
  else cfg.prep = clamp(cfg.prep + d * 5, 0, 60);
  save(); syncConfig();
}));
$$('.seg[data-opt]').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = seg.dataset.opt, v = b.dataset.v;
  cfg[k] = (k === 'ticks') ? v === 'true' : v;
  save(); syncConfig();
  if (k === 'audio') preview('bip');
}));
$('#vol').addEventListener('input', e => { cfg.vol = parseFloat(e.target.value); save(); });
$('#vol').addEventListener('change', () => preview('bip'));

/* ================= PWA : manifest + icône générés à la volée ================= */
(function pwa(){
  try {
    const icon = size => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d'), u = size / 180;
      g.fillStyle = '#000'; g.fillRect(0, 0, size, size);
      g.fillStyle = '#F5F5F5';
      [100, 40, 100, 40].forEach((h, i) => g.fillRect((29 + i * 34) * u, (90 - h / 2) * u, 20 * u, h * u));
      return c.toDataURL('image/png');
    };
    const touch = document.createElement('link');
    touch.rel = 'apple-touch-icon'; touch.href = icon(180);
    document.head.appendChild(touch);
    const manifest = {
      name: 'Fractionné', short_name: 'Fractionné', display: 'standalone',
      background_color: '#000000', theme_color: '#000000',
      start_url: location.href.split('#')[0],
      icons: [{ src: icon(512), sizes: '512x512', type: 'image/png' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
  } catch (e) {}
})();

/* ================= Init ================= */
renderSteps();
syncConfig();
})();
</script>
</body>
</html>
